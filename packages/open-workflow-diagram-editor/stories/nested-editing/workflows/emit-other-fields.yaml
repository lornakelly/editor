#
# Nested editing focus: "Other fields", the keys an object allows beyond its own properties.
# notifyShipped carries CloudEvents extension attributes (tenantid, traceparent) beside the
# event's own type/source: they show as one "Other fields" map. notifyPlain has none, so it offers
# the "+ Other fields" chip. awaitConfirmation is a listen task (one strategy) whose filter has
# an extension attribute too.
document:
  dsl: "1.0.3"
  namespace: examples
  name: emit-other-fields
  version: "0.1.0"
do:
  - notifyShipped:
      emit:
        event:
          with:
            type: com.acme.order.shipped
            source: https://acme.com/shipping
            datacontenttype: application/json
            tenantid: acme-eu
            traceparent: ${ $context.trace }
            data:
              orderId: ${ .orderId }
  - notifyPlain:
      emit:
        event:
          with:
            type: com.acme.order.placed
            source: https://acme.com/orders
  - awaitConfirmation:
      listen:
        to:
          one:
            with:
              type: com.acme.order.confirmed
              tenantid: acme-eu
